<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siden finnes ikke – Leon Frick</title>
  <meta name="theme-color" content="#110c0c" />
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:radial-gradient(circle at 10% 10%, rgba(180,85,35,.18), transparent 22%),radial-gradient(circle at 88% 12%, rgba(101,25,22,.18), transparent 24%),linear-gradient(180deg,#100b0b 0%,#120e0e 45%,#0f0b0b 100%);color:#f6f0eb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{max-width:42rem;padding:2rem;border-radius:30px;background:rgba(27,20,20,.78);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.09);box-shadow:0 28px 80px rgba(0,0,0,.35)}
    h1{margin:.4rem 0 1rem;font-size:clamp(2.2rem,6vw,4rem);line-height:1;letter-spacing:-.05em}
    p{color:#d7c9bf;line-height:1.65}
    .eyebrow{display:block;margin-bottom:.6rem;font-size:.8rem;letter-spacing:.24em;text-transform:uppercase;color:#f3e8df}
    a{display:inline-flex;margin-top:1rem;padding:1rem 1.4rem;border-radius:999px;background:#f3f0ed;color:#17100f;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">404</span>
    <h1>Den siden finnes ikke.</h1>
    <p>Adressen kan være gammel eller feil. Gå tilbake til forsiden for musikk, tekster, samarbeid og kontakt.</p>
    <a href="/">Til forsiden</a>
  </div>
</body>
</html>
